<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/etteum.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!--
      theme-color drives the mobile browser chrome. These MUST match
      --background in index.css for each scheme, or the address bar reads as a
      seam against the page. Dark: #0c0e0d · Light: #f3f7f4
    -->
    <meta name="theme-color" content="#0c0e0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f7f4" media="(prefers-color-scheme: light)" />
    <title>Etteum Dashboard</title>
    <!--
      Type pairing: IBM Plex Sans for prose/labels, JetBrains Mono for every
      number, key, ID and log line. Both have real character and were designed
      for technical interfaces — no Arial/Inter fallback look.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <script>
      // No-flash theme: apply the saved theme before first paint. Dark is default.
      // The theme-color metas above are authored per-scheme and carry a media
      // attribute, so no JS patching is needed for the initial paint — only
      // useTheme() updates them at runtime.
      (function () {
        try {
          if (localStorage.getItem("poolprox-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
